<!DOCTYPE html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>focus({ preventScroll: false }) on the already focused element doesn't scroll it into view</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/interaction.html#dom-focus">
<link rel="help" href="https://github.com/whatwg/html/issues/4512">
<link rel="match" href="/css/reference/ref-filled-green-100px-square-only.html">
<meta name="assert" content="Calling focus({ preventScroll: false }) on an element that was focused with focus({ preventScroll: true }) doesn't scroll it into view.">
<style>
  html {
    overflow: hidden;
  }
  #target, #control {
    margin-top: 200vh;
    width: 100px;
    height: 100px;
    background: red;
    outline: none;
  }
</style>
<p>Test passes if there is a filled green square.</p>
<div id="square" style="width: 100px; height: 100px; background: green;"></div>
<div id="target" tabindex="-1"></div>
<div id="control" tabindex="-1"></div>
<script src="/common/reftest-wait.js"></script>
<script>
  const square = document.getElementById("square");
  const target = document.getElementById("target");
  const control = document.getElementById("control");
  control.focus({ preventScroll: false });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    // focus({ preventScroll: false }) on the control has to scroll it into view; otherwise the
    // test checks nothing, so make it fail.
    if (window.scrollY == 0)
      square.style.background = "red";
    window.scrollTo(0, 0);
    target.focus({ preventScroll: true });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (document.activeElement != target || window.scrollY != 0)
        square.style.background = "red";
      target.focus({ preventScroll: false });
      requestAnimationFrame(() => requestAnimationFrame(takeScreenshot));
    }));
  }));
</script>
</html>
